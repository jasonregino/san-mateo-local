<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- HELD until tested. Remove noindex + add entry points at go-live. -->
  <meta name="robots" content="noindex, nofollow" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZBBC09ZJZQ"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-ZBBC09ZJZQ');</script>
  <title>Ask the Guide | San Mateo Local</title>
  <meta name="description" content="Tell San Mateo Local's guide what you need, a restaurant, a plumber, a barber, or something to do, and get real, local picks." />
  <link rel="canonical" href="https://sanmateolocal.com/ask.html" />
  <meta name="theme-color" content="#221D16" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#FAF6EC;--paper-2:#F2E9D4;--ink:#221D16;--ink-soft:#5E5446;--clay:#C25B3A;--clay-deep:#A5492B;--sage-deep:#324C3A;--line:#E3D6BC;--card:#FFFDF7}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:6.75rem}
    h1{font-family:'Fraunces',Georgia,serif;line-height:1.14;font-weight:600;letter-spacing:-0.01em}
    a{color:inherit}
    header.site{border-bottom:1.5px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:30}
    header.site .bar{max-width:820px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 1.1rem}
    .brand{display:flex;align-items:center;gap:.5rem;text-decoration:none;color:var(--ink)}
    .brand span{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;letter-spacing:-0.02em}
    header .back{color:var(--ink-soft);text-decoration:none;font-size:.88rem}
    header .back:hover{color:var(--clay-deep)}
    .wrap{max-width:820px;margin:0 auto;width:100%;padding:0 1.1rem}
    .intro{padding:1.6rem 0 .5rem;text-align:center}
    .intro .kick{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--clay-deep);font-weight:700}
    .intro h1{font-size:clamp(1.8rem,5vw,2.4rem);margin:.5rem 0 .35rem}
    .intro p{color:var(--ink-soft);font-size:1.02rem;max-width:34rem;margin:0 auto}
    .intro .note{font-size:.8rem;color:var(--ink-soft);margin-top:.6rem}
    #chat{display:flex;flex-direction:column;gap:.9rem;padding:1.1rem 0 .4rem}
    .msg{max-width:88%;padding:.8rem 1.05rem;border-radius:14px;font-size:.98rem}
    .msg.bot{align-self:flex-start;background:var(--paper-2);border:1.5px solid var(--line);border-bottom-left-radius:4px}
    .msg.me{align-self:flex-end;background:var(--clay);color:#fff;border-bottom-right-radius:4px}
    .msg a{color:var(--clay-deep);font-weight:700}
    .msg.me a{color:#fff;text-decoration:underline}
    .msg.bot strong{color:var(--ink)}
    .typing{align-self:flex-start;color:var(--ink-soft);font-size:.9rem;padding:.4rem .2rem}
    .chips{display:flex;flex-wrap:wrap;gap:.5rem;padding:.2rem 0 .6rem}
    .chip{background:var(--card);border:1.5px solid var(--line);color:var(--ink);font-size:.85rem;font-weight:600;padding:.45rem .9rem;border-radius:999px;cursor:pointer}
    .chip:hover{border-color:var(--clay)}
    /* floating input, always visible */
    .composer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:1.5px solid var(--line);padding:.7rem 1.1rem;padding-bottom:calc(.7rem + env(safe-area-inset-bottom));box-shadow:0 -6px 20px -12px rgba(34,29,22,.4)}
    .composer form{max-width:820px;margin:0 auto;display:flex;gap:.55rem;align-items:center}
    .composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:.8rem 1.1rem;font:inherit;background:#fff;color:var(--ink)}
    .composer input:focus{outline:2px solid var(--clay);border-color:transparent}
    .mic{flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:999px;width:46px;height:46px;cursor:pointer;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center}
    .mic:hover{border-color:var(--clay)}
    .mic.on{background:var(--clay);border-color:var(--clay);color:#fff;animation:pulse 1.1s ease-in-out infinite}
    .mic svg{width:20px;height:20px}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(194,91,58,.45)}50%{box-shadow:0 0 0 7px rgba(194,91,58,0)}}
    .send{flex:none;background:var(--clay);color:#fff;border:none;border-radius:999px;padding:.8rem 1.35rem;font-weight:700;font-size:.95rem;cursor:pointer}
    .send:hover{background:var(--clay-deep)}
    .send:disabled{opacity:.55;cursor:default}
    @media (max-width:520px){ .send{padding:.8rem 1.05rem} }
    /* Wider screens: the input flows right under the conversation instead of pinning to the far bottom */
    @media (min-width:760px){
      body{padding-bottom:1.5rem}
      .composer{position:static;background:transparent;border-top:none;box-shadow:none;padding:.4rem 1.1rem 2.5rem}
    }
  </style>
</head>
<body>
  <header class="site">
    <div class="bar">
      <a class="brand" href="index.html">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="14" r="6" fill="#C25B3A"/><path d="M1 27 Q9 19 16 23 T31 25 V32 H1 Z" fill="#41614B"/></svg>
        <span>San Mateo Local</span>
      </a>
      <a class="back" href="index.html">&larr; Home</a>
    </div>
  </header>

  <div class="wrap">
    <div class="intro">
      <p class="kick">Ask the guide</p>
      <h1>What are you looking for?</h1>
      <p>A restaurant, a plumber, a barber, something to do this weekend. Tell me what you need and I'll point you to real local spots from the guide.</p>
      <p class="note">Tap a spot's name for the map and directions. Hours change, so call ahead.</p>
    </div>

    <div id="chat"></div>

    <div class="chips" id="chips">
      <button class="chip">Best coffee downtown</button>
      <button class="chip">I need a plumber</button>
      <button class="chip">Something to do this weekend</button>
      <button class="chip">Date-night dinner</button>
    </div>
  </div>

  <div class="composer">
    <form id="composer">
      <button type="button" class="mic" id="mic" aria-label="Speak your question">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <input id="q" type="text" placeholder="e.g. I need a plumber, or tacos near 25th Ave" autocomplete="off" required />
      <button type="submit" class="send" id="send">Ask</button>
    </form>
  </div>

  <script>
    var chat = document.getElementById('chat');
    var chips = document.getElementById('chips');
    var form = document.getElementById('composer');
    var input = document.getElementById('q');
    var sendBtn = document.getElementById('send');
    var micBtn = document.getElementById('mic');
    var messages = [];

    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function render(t){
      var h = esc(t);
      h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      h = h.replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
      h = h.replace(/\n/g, '<br>');
      return h;
    }
    function toBottom(){ window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }); }
    function bubble(role, text){
      var d = document.createElement('div');
      d.className = 'msg ' + (role === 'me' ? 'me' : 'bot');
      d.innerHTML = render(text);
      chat.appendChild(d);
      toBottom();
      return d;
    }

    bubble('bot', "Hi! I'm your San Mateo Local guide. Looking for a place to eat, a local service, or something to do? Tell me what you need.");

    var busy = false;
    async function ask(text){
      text = (text || '').trim();
      if (busy || !text) return;
      busy = true; sendBtn.disabled = true;
      chips.style.display = 'none';
      bubble('me', text);
      messages.push({ role: 'user', content: text });
      var typing = document.createElement('div');
      typing.className = 'typing'; typing.textContent = 'Looking...';
      chat.appendChild(typing); toBottom();
      try {
        var res = await fetch('/api/concierge', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ messages: messages })
        });
        var data = await res.json();
        typing.remove();
        var reply = data.reply || data.error || "Sorry, I had trouble there. Try asking again.";
        bubble('bot', reply);
        if (data.reply) messages.push({ role: 'assistant', content: data.reply });
      } catch (e) {
        typing.remove();
        bubble('bot', "Sorry, I couldn't reach the guide just now. Try again in a moment.");
      }
      busy = false; sendBtn.disabled = false;
    }

    form.addEventListener('submit', function(e){ e.preventDefault(); var t = input.value; input.value = ''; ask(t); });
    chips.addEventListener('click', function(e){ if (e.target.classList.contains('chip')) ask(e.target.textContent); });

    /* Voice input: speak instead of type (hidden if the browser can't do it) */
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { micBtn.style.display = 'none'; }
    else {
      var rec = new SR();
      rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
      var listening = false;
      var basePlaceholder = input.getAttribute('placeholder');
      micBtn.addEventListener('click', function(){
        if (listening) { try { rec.stop(); } catch(e){} return; }
        try { rec.start(); } catch(e){}
      });
      rec.onstart = function(){ listening = true; micBtn.classList.add('on'); input.setAttribute('placeholder', 'Listening...'); };
      rec.onend = function(){ listening = false; micBtn.classList.remove('on'); input.setAttribute('placeholder', basePlaceholder); };
      rec.onerror = function(){ listening = false; micBtn.classList.remove('on'); input.setAttribute('placeholder', basePlaceholder); };
      rec.onresult = function(e){ var t = e.results[0][0].transcript; ask(t); };
    }
  </script>
</body>
</html>
