name: This Weekend freshness check

# Runs on GitHub's servers every Monday — no need for anything to be open on Jason's end.
# It reads the deployed homepage's This Weekend date and, if it's stale (7+ days old),
# opens an Issue so the front-page lead gets refreshed. It NEVER edits the site.
# Pairs with the browser-side guard in index.html that hides a stale lead on load.

on:
  schedule:
    - cron: '45 15 * * 1'   # Mondays 15:45 UTC (~8:45am Pacific), just after the DSMA + coverage scans
  workflow_dispatch: {}       # lets Jason run it on demand from the Actions tab

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check This Weekend freshness
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/this-weekend-freshness.mjs
