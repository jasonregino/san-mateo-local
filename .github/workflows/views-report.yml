name: Views report (verified businesses)

# Step 1: proves keyless GA4 access works and prints last-30-day views for each verified
# business. Manual for now; becomes monthly once the email version is built.
# Auth: Workload Identity Federation. No key file exists; Google only trusts this repo.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/916326327666/locations/global/workloadIdentityPools/github/providers/san-mateo-local
          service_account: sml-ga4-reader@project-904c9dfe-0f36-4746-892.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
      - name: Views per verified business
        env:
          GA_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: node .github/views-report.mjs
